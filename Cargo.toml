[package]
name = "verihash"
version = "1.2.0"
edition = "2024"
authors = ["Maple Bamboo Team"]
license = "ISC"
repository = "https://github.com/Harvey2433/VeriHash"
description = "Cross-platform interactive file hashing and verification tool"
readme = "README.md"

[dependencies]
# 交互菜单（多选、输入、确认）
dialoguer = "0.11"
# 进度条 + Spinner 动画
indicatif = "0.17"
# 终端状态颜色
console = "0.15"
# 并行计算与线程池
rayon = "1.8"
# 任务队列（配合 rayon 做批量任务）
crossbeam-channel = "0.5"
# 通配符路径匹配（支持 **/*）
glob = "0.3"
# BlazeHash/Hashdeep 清单中的 CSV 记录
csv = "1.3"
# 哈希算法
fast-md5 = "1.0.0"
sha2 = "0.10"
sha3 = "0.10"
blake2b_simd = "1.0.4"
blake2s_simd = "1.0.4"
blake3 = { version = "1.5", features = ["rayon"] }
# 临时文件（边算边写，不占内存）
tempfile = "3.8"
# CPU 核心数检测
num_cpus = "1.16"
# 优雅的错误处理
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19.1", default-features = false, features = ["fs", "io-uring", "polling"] }

[target.'cfg(windows)'.dependencies]
compio = { version = "0.19.1", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
# 最高强度优化
opt-level = 3
lto = "fat"
# 单线程编译单元
codegen-units = 1
# 剥离调试信息
strip = "symbols"
# 异常处理：退出
#panic = "abort"
